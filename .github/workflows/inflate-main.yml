name: Inflate main.ts
on:
  push:
    branches: [fix/difficulty-mute-paradox]
    paths:
      - "src/mainParts/**"
      - "scripts/inflate-main.mjs"
      - ".github/workflows/inflate-main.yml"
  workflow_dispatch:
jobs:
  inflate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/difficulty-mute-paradox
      - name: Inflate src/main.ts
        run: node scripts/inflate-main.mjs
      - name: Commit inflated main.ts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts
          if git diff --cached --quiet; then
            echo "main.ts already up to date"
            exit 0
          fi
          git commit -m "Wire topbar mute to music+SFX and apply unlock seed on start"
          git push
